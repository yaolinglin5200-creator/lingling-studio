<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曜靈飛行補給｜公開試玩</title><link rel="stylesheet" href="embed.css?v=0.9.0">
<style>
*{box-sizing:border-box}body{margin:0;background:#e8eee2;color:#234337;font:18px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:12px}h1{font-size:23px;margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button,a{font:inherit;min-height:48px;border:1px solid #9faf97;border-radius:12px;padding:8px 16px;background:#fffbed;color:#244b3c}button:focus-visible,a:focus-visible{outline:3px solid #886b28;outline-offset:3px}#stage{position:relative;max-width:900px;margin:12px auto;background:#cee1de;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;height:auto;touch-action:none;user-select:none}#overlay{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;padding:20px;background:#f7f3e8ed}#overlay[hidden]{display:none}#overlay h2{margin:0;font-size:24px}#overlay p{max-width:560px;margin:10px 0}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.controls button{min-width:64px;touch-action:none;font-size:24px}.note{font-size:16px}#hud{font-variant-numeric:tabular-nums}#notice{min-height:29px;text-align:center}@media(max-height:500px) and (orientation:landscape){main{padding:4px 12px}h1{font-size:18px}.note{display:none}#stage{max-width:calc((100dvh - 150px)*1.6667);margin:4px auto}.controls button{min-height:48px}header button{min-height:44px}}
</style></head><body><main><header><h1>曜靈飛行補給｜V0.9.0 公開試玩</h1><span id="hud">補給箱 0 · 剩餘 120 秒</span><button id="pause" disabled>暫停</button></header><p class="note">方向鍵／WASD或按住下方方向鈕。收木箱、繞雲團，兩分鐘後抵達；不扣貨、不出題。可隨時回村。</p><div id="stage"><canvas id="sky" width="800" height="480" tabindex="0" aria-label="飛行場景，使用方向鍵或下方方向鈕操作"></canvas><section id="overlay"><h2 id="title">一起送補給上山！</h2><p id="description">這是開發中原型。按開始後飛行兩分鐘，可隨時暫停；切換分頁也會自動暫停。沒有帳號，不保存個資。</p><button id="start">開始飛行</button><a href="../">回村莊入口</a></section></div><nav class="controls" aria-label="飛行方向"><button data-key="ArrowLeft" aria-label="向左飛">←</button><button data-key="ArrowUp" aria-label="向上飛">↑</button><button data-key="ArrowDown" aria-label="向下飛">↓</button><button data-key="ArrowRight" aria-label="向右飛">→</button></nav><p id="notice" aria-live="polite"></p></main><script src="logic.js?v=0.9.0"></script><script src="ui.js?v=0.9.0"></script></body></html>
