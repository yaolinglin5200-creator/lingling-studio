<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efe5">
  <title>互動遊戲室｜靈靈創作工作室</title>
  <meta name="description" content="歡迎來到靈靈創作工作室互動遊戲室，選一款遊戲開始玩。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="返回靈靈創作工作室官網">
      <img src="../assets/images/brand/logos/brand-logo.png" alt="">
      <span><strong>靈靈創作工作室</strong><small>Lingling Creative Studio</small></span>
    </a>
    <a class="home-link" href="../index.html">返回官網</a>
  </header>

  <main>
    <section class="hero" aria-labelledby="room-title">
      <p class="eyebrow">INTERACTIVE GAME ROOM</p>
      <h1 id="room-title">互動遊戲室</h1>
      <p>故事不只用看的，選一扇門進去玩吧。</p>
      <div class="hero-decoration" aria-hidden="true"><span>✦</span><span>●</span><span>✧</span></div>
    </section>

    <section class="game-grid" aria-label="遊戲列表">
      <a class="game-card game-one" href="https://game001-lingling-studio.huang06100610.chatgpt.site" target="_blank" rel="noopener noreferrer" aria-label="開啟 GAME-001 歡迎來到靈靈創作工作室（在新分頁開啟）">
        <span class="game-number">GAME-001</span>
        <span class="game-art" aria-hidden="true">
          <span class="studio-door">WELCOME</span>
          <span class="character-icon">👋</span>
        </span>
        <span class="game-copy">
          <strong>歡迎來到<br>靈靈創作工作室</strong>
          <span>走進工作室，看看大家今天又在忙什麼。</span>
        </span>
        <span class="play-button">開始遊戲 <b>↗</b></span>
      </a>

      <a class="game-card game-two" href="game-002/index.html" aria-label="開啟 GAME-002 若衡追大魔王">
        <span class="game-number">GAME-002 · PROTOTYPE</span>
        <span class="game-art" aria-hidden="true">
          <span class="chase-icon">🏃‍♀️</span>
          <span class="impact-icon">💥</span>
          <span class="demon-icon">😈</span>
        </span>
        <span class="game-copy">
          <strong>若衡追大魔王</strong>
          <span>點一下、揮一棒，追上那個假裝很忙的大魔王。</span>
        </span>
        <span class="play-button">開始追擊 <b>→</b></span>
      </a>
    </section>

    <p class="room-note">更多互動作品，正在工作室裡慢慢長大。</p>
  </main>

  <footer>© 2026 Lingling Creative Studio · 遊戲開心，記得休息</footer>
</body>
</html>
